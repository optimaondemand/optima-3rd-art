<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Songwriters' Club</title>
<style>
  :root{--cream:#f6ecd9;--ink:#2a1a12;--orange:#e0612b;--mustard:#e9a93b;--teal:#2a8c82;--wood:#8a5a34;--wood2:#5e3a20}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ink);color:var(--cream);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
  .hero{height:100%;min-height:360px;display:flex;align-items:center;justify-content:center;gap:34px;padding:16px 24px;position:relative}

  /* ---------- Turntable ---------- */
  .deck{position:relative;width:270px;height:250px;flex:none}
  .plinth{position:absolute;inset:0;border-radius:18px;background:linear-gradient(145deg,var(--wood),var(--wood2));
    box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 10px 24px rgba(0,0,0,.45);border:3px solid #3c2412}
  .knob{position:absolute;right:18px;bottom:16px;width:14px;height:14px;border-radius:50%;background:#3a2a20;box-shadow:inset 0 0 0 3px #1c120c}
  .light{position:absolute;right:22px;bottom:40px;width:6px;height:6px;border-radius:50%;background:#5a2b16;transition:background .3s, box-shadow .3s}
  .light.on{background:#ff8a4c;box-shadow:0 0 8px #ff8a4c}
  .platter{position:absolute;left:14px;top:14px;width:222px;height:222px;border-radius:50%;background:#2b2b2b;box-shadow:0 4px 10px rgba(0,0,0,.6)}
  .disc-wrap{position:absolute;left:20px;top:20px;width:210px;height:210px;transition:transform .45s cubic-bezier(.5,0,.3,1),opacity .45s}
  .disc-wrap.out{transform:translateX(-150px) rotate(-40deg);opacity:0}
  button.record{all:unset;display:block;width:100%;height:100%;border-radius:50%;cursor:pointer}
  button.record:focus-visible{outline:3px solid #55c8e8;outline-offset:4px}
  .record svg{width:100%;height:100%;display:block}
  .sheen{position:absolute;left:20px;top:20px;width:210px;height:210px;border-radius:50%;pointer-events:none;
    background:conic-gradient(from 20deg,transparent 0 30deg,rgba(255,255,255,.10) 45deg,transparent 60deg 200deg,rgba(255,255,255,.07) 215deg,transparent 230deg)}
  .arm{position:absolute;right:6px;top:12px;width:60px;height:190px;transform-origin:42px 22px;
    transform:rotate(-24deg);transition:transform .9s cubic-bezier(.45,.05,.3,1.2);pointer-events:none;z-index:3}
  .arm.down{transform:rotate(9deg)}
  .note{position:absolute;pointer-events:none;font-family:"Segoe UI Symbol","Apple Symbols","DejaVu Sans",serif;font-weight:bold;
    text-shadow:0 2px 0 rgba(0,0,0,.35);will-change:transform,opacity;z-index:4}

  /* ---------- Title + shelf ---------- */
  .right{max-width:560px;min-width:0}
  .kicker{font-family:"Courier New",monospace;font-size:13px;letter-spacing:4px;color:var(--mustard);font-weight:bold}
  h1{font-family:"Arial Black","Arial Bold",Arial,sans-serif;font-size:40px;line-height:1.05;margin:6px 0 2px;letter-spacing:.5px}
  h1 span{color:var(--orange)}
  .tag{font-family:Georgia,serif;font-style:italic;font-size:19px;color:var(--mustard);margin-bottom:10px}
  .now{font-family:"Courier New",monospace;font-size:13px;font-weight:bold;color:#e8dcc4;margin-bottom:6px;min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now b{color:var(--mustard)}
  .now .eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px;margin-right:6px;vertical-align:-1px}
  .now .eq i{width:3px;height:3px;background:var(--mustard);border-radius:1px}
  .now.playing .eq i{animation:eq .5s ease-in-out infinite alternate}
  .now.playing .eq i:nth-child(2){animation-delay:.15s}.now.playing .eq i:nth-child(3){animation-delay:.3s}
  @keyframes eq{to{height:11px}}

  .shelf{position:relative;padding:0 8px}
  .crate{display:flex;gap:7px;align-items:flex-end;padding:30px 6px 0;margin-top:-18px;overflow-x:auto;overflow-y:visible;scrollbar-width:thin;scrollbar-color:var(--wood) transparent}
  .board{height:12px;border-radius:3px;background:linear-gradient(#a06a3c,#6e4424);box-shadow:0 4px 0 #3c2412,0 8px 12px rgba(0,0,0,.4)}
  .sleeve{all:unset;position:relative;flex:none;width:52px;height:56px;cursor:pointer;transition:transform .2s}
  .sleeve:focus-visible{outline:3px solid #55c8e8;outline-offset:2px;border-radius:4px}
  .sleeve .vinyl{position:absolute;left:8px;top:-2px;width:44px;height:44px;border-radius:50%;
    background:radial-gradient(circle,var(--c) 0 7px,#111 7.5px 9px,#1b1b1b 9px 100%);
    box-shadow:inset 0 0 0 2px #262626;transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
  .sleeve .jacket{position:absolute;left:0;bottom:0;width:48px;height:48px;border-radius:3px;background:var(--c);
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.18),2px 2px 0 rgba(0,0,0,.35);overflow:hidden;display:grid;place-items:center;
    font-size:20px;line-height:1}
  .jacket::before{content:"";position:absolute;inset:0;opacity:.28;background:var(--pat)}
  .jacket span{position:relative}
  .sleeve:hover{transform:translateY(-4px) rotate(-2deg)}
  .sleeve:hover .vinyl{transform:translateY(-6px)}
  .sleeve[aria-pressed="true"] .vinyl{transform:translate(4px,-14px) rotate(30deg)}
  .sleeve[aria-pressed="true"] .jacket{box-shadow:inset 0 0 0 2px rgba(0,0,0,.18),0 0 0 3px var(--cream)}
  .tip{position:absolute;bottom:58px;left:50%;transform:translateX(-50%) translateY(4px);background:var(--cream);color:var(--ink);
    font-family:"Courier New",monospace;font-weight:bold;font-size:11px;padding:3px 7px;border-radius:6px;white-space:nowrap;
    opacity:0;pointer-events:none;transition:.15s;z-index:5}
  .sleeve:hover .tip,.sleeve:focus-visible .tip{opacity:1;transform:translateX(-50%)}

  .hint{display:inline-flex;align-items:center;gap:8px;margin-top:12px;font-family:"Courier New",monospace;font-size:12px;font-weight:bold;
    color:var(--ink);background:var(--mustard);padding:5px 11px;border-radius:20px;transition:opacity .4s}
  .hint .dot{width:8px;height:8px;border-radius:50%;background:var(--orange);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{transform:scale(1.6);opacity:.5}}

  @media (max-width:700px){
    .hero{flex-direction:column;gap:4px;padding:8px 10px}
    .deck{transform:scale(.52);margin:-58px 0 -60px}
    .kicker{font-size:10px;letter-spacing:2px;text-align:center}
    h1{font-size:24px;margin:2px 0;text-align:center}.tag{display:none}
    .now{text-align:center;font-size:11px}.right{width:100%}
    .hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){.arm,.disc-wrap,.sleeve,.sleeve .vinyl{transition:none}.hint .dot,.now .eq i{animation:none!important}}
</style>
</head>
<body>
<div class="hero" id="hero">
  <div class="deck" id="deck">
    <div class="plinth"></div><div class="knob"></div>
    <div class="light" id="light"></div>
    <div class="platter"></div>
    <div class="disc-wrap" id="discWrap">
      <button class="record" id="record" aria-pressed="false" aria-label="Drop the needle and play">
        <svg viewBox="0 0 200 200" id="disc" aria-hidden="true">
          <defs>
            <radialGradient id="vg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#202020"/><stop offset="1" stop-color="#111"/></radialGradient>
            <path id="arcTop" d="M 100 100 m -26 0 a 26 26 0 1 1 52 0"/>
          </defs>
          <circle cx="100" cy="100" r="99" fill="url(#vg)"/>
          <g fill="none" stroke="#2c2c2c" stroke-width="0.8">
            <circle cx="100" cy="100" r="92"/><circle cx="100" cy="100" r="86"/><circle cx="100" cy="100" r="80"/>
            <circle cx="100" cy="100" r="74"/><circle cx="100" cy="100" r="68"/><circle cx="100" cy="100" r="62"/>
            <circle cx="100" cy="100" r="56"/><circle cx="100" cy="100" r="50"/><circle cx="100" cy="100" r="44"/>
          </g>
          <circle id="lbl" cx="100" cy="100" r="35" fill="#e0612b" stroke="#e9a93b" stroke-width="3"/>
          <text id="lblArc" font-family="Courier New, monospace" font-size="7" font-weight="bold" fill="#2a1a12" letter-spacing="1.2">
            <textPath href="#arcTop" startOffset="50%" text-anchor="middle" id="lblTitle">SONGWRITERS</textPath>
          </text>
          <text id="lblEmoji" x="100" y="121" text-anchor="middle" font-size="14">🎵</text>
          <text id="lblSide" x="100" y="130" text-anchor="middle" font-family="Courier New, monospace" font-size="5.5" font-weight="bold" fill="#2a1a12">OAO · SIDE A</text>
          <circle cx="100" cy="100" r="4" fill="#f6ecd9"/>
        </svg>
      </button>
    </div>
    <div class="sheen"></div>
    <svg class="arm" id="arm" viewBox="0 0 60 190" aria-hidden="true">
      <circle cx="42" cy="22" r="17" fill="#c9c2b4" stroke="#8d8577" stroke-width="2"/>
      <circle cx="42" cy="22" r="8" fill="#6f685d"/>
      <rect x="36" y="2" width="12" height="9" rx="2" fill="#4a443c"/>
      <path d="M42 30 L42 140 Q42 158 30 166" fill="none" stroke="#d8d1c2" stroke-width="5" stroke-linecap="round"/>
      <path d="M42 30 L42 140 Q42 158 30 166" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5" stroke-linecap="round"/>
      <rect x="18" y="160" width="20" height="24" rx="3" fill="#2a1a12" stroke="#e9a93b" stroke-width="2" transform="rotate(28 28 172)"/>
    </svg>
  </div>

  <div class="right">
    <div class="kicker">OAO RECORDS · NOW ON VINYL</div>
    <h1>THE <span>SONG</span>WRITERS' CLUB</h1>
    <div class="tag">Write it. Hum it. Own it.</div>
    <div class="now" id="now" aria-live="polite"><span class="eq"><i></i><i></i><i></i></span>On the turntable: <b id="nowTitle">Country Road</b></div>
    <div class="shelf">
      <div class="crate" id="crate" role="group" aria-label="Record shelf: pick a song"></div>
      <div class="board"></div>
    </div>
    <div class="hint" id="hint"><span class="dot"></span>Pick a record, then click the turntable! 🔊</div>
  </div>
</div>

<script>
(() => {
  /* ===== The record collection (files live in ./audio/) ===== */
  const RECORDS = [
    { file:'country-road.mp3',   title:'Country Road',   genre:'Country',        emoji:'🤠', color:'#e9a93b', rim:'#8a5a34', ink:'#2a1a12', pat:'repeating-linear-gradient(45deg,#000 0 3px,transparent 3px 9px)' },
    { file:'rock-anthem.mp3',    title:'Rock Anthem',    genre:'Rock',           emoji:'🎸', color:'#d6402b', rim:'#2a1a12', ink:'#f6ecd9', pat:'repeating-linear-gradient(-60deg,#000 0 4px,transparent 4px 12px)' },
    { file:'hip-hop-beat.mp3',   title:'Hip-Hop Beat',   genre:'Hip-Hop',        emoji:'🎧', color:'#7a5cc0', rim:'#e9a93b', ink:'#f6ecd9', pat:'radial-gradient(circle,#000 2px,transparent 2.5px) 0 0/9px 9px' },
    { file:'smooth-jazz.mp3',    title:'Smooth Jazz',    genre:'Jazz',           emoji:'🎷', color:'#2f5fa8', rim:'#e9a93b', ink:'#f6ecd9', pat:'repeating-linear-gradient(90deg,#000 0 2px,transparent 2px 7px)' },
    { file:'soul-groove.mp3',    title:'Soul Groove',    genre:'Soul & Dance',   emoji:'🪩', color:'#b5487a', rim:'#f6ecd9', ink:'#f6ecd9', pat:'repeating-radial-gradient(circle at 50% 120%,#000 0 3px,transparent 3px 8px)' },
    { file:'spanish-guitar.mp3', title:'Spanish Guitar', genre:'Flamenco',       emoji:'💃', color:'#e0612b', rim:'#2a1a12', ink:'#2a1a12', pat:'repeating-linear-gradient(0deg,#000 0 3px,transparent 3px 10px)' },
    { file:'cello-strings.mp3',  title:'Cello Strings',  genre:'Classical',      emoji:'🎻', color:'#1f3a5f', rim:'#d8c08a', ink:'#f6ecd9', pat:'repeating-linear-gradient(135deg,#fff 0 1px,transparent 1px 6px)' },
    { file:'mellow-mood.mp3',    title:'Mellow Mood',    genre:'Chill',          emoji:'🌙', color:'#2a8c82', rim:'#9be0d4', ink:'#f6ecd9', pat:'radial-gradient(circle,#fff 1.5px,transparent 2px) 0 0/8px 8px' }
  ];

  const $ = id => document.getElementById(id);
  const rec = $('record'), disc = $('disc'), arm = $('arm'), light = $('light'), hint = $('hint'),
        deck = $('deck'), hero = $('hero'), crate = $('crate'), discWrap = $('discWrap'), now = $('now');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const GLYPHS = ['♪','♫','♬','♩'];

  /* ===== audio: the song + vinyl crackle ===== */
  let actx, crackleGain, current = 0, audio = null, rateRaf = null;
  function crackleOn(on){
    try {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        const len = actx.sampleRate * 3, b = actx.createBuffer(1, len, actx.sampleRate), d = b.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * .01 + (Math.random() < .0006 ? (Math.random() * 2 - 1) * .5 : 0);
        const s = actx.createBufferSource(); s.buffer = b; s.loop = true;
        const f = actx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 900;
        crackleGain = actx.createGain(); crackleGain.gain.value = 0;
        s.connect(f); f.connect(crackleGain); crackleGain.connect(actx.destination); s.start();
      }
      if (actx.state === 'suspended') actx.resume();
      const t = actx.currentTime; crackleGain.gain.cancelScheduledValues(t);
      crackleGain.gain.setValueAtTime(crackleGain.gain.value, t);
      crackleGain.gain.linearRampToValueAtTime(on ? .35 : 0, t + (on ? .1 : 1));
    } catch (e) {}
  }
  const allAudio = [];
  function hardStopAll(){ allAudio.forEach(x => { try { x.pause(); x.playbackRate = 1; x.volume = 1; } catch (e) {} }); }
  function loadAudio(i){
    cancelAnimationFrame(rateRaf); hardStopAll();
    audio = new Audio('audio/' + RECORDS[i].file);
    audio.loop = true; audio.preload = 'auto';
    ['preservesPitch','mozPreservesPitch','webkitPreservesPitch'].forEach(k => { if (k in audio) audio[k] = false; });
    allAudio.push(audio);
  }
  // ramp playbackRate (+ volume) for spin-up / wind-down
  function rampRate(a, from, to, ms, volFrom, volTo, done){
    cancelAnimationFrame(rateRaf);
    const t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / ms), e = k * (2 - k);
      try { a.playbackRate = from + (to - from) * e; } catch (x) {}
      a.volume = Math.max(0, Math.min(1, volFrom + (volTo - volFrom) * e));
      if (k < 1) rateRaf = requestAnimationFrame(step); else done && done();
    };
    rateRaf = requestAnimationFrame(step);
  }

  /* ===== shelf ===== */
  RECORDS.forEach((r, i) => {
    const b = document.createElement('button');
    b.className = 'sleeve'; b.style.setProperty('--c', r.color); b.style.setProperty('--pat', r.pat);
    b.setAttribute('aria-pressed', i === current);
    b.setAttribute('aria-label', `${r.title} (${r.genre})`);
    b.innerHTML = `<span class="vinyl"></span><span class="jacket"><span>${r.emoji}</span></span><span class="tip">${r.title}</span>`;
    b.addEventListener('click', () => choose(i));
    crate.appendChild(b);
  });

  function paintLabel(i){
    const r = RECORDS[i];
    $('lbl').setAttribute('fill', r.color); $('lbl').setAttribute('stroke', r.rim);
    $('lblTitle').textContent = r.title.toUpperCase();
    ['lblArc','lblSide'].forEach(id => $(id).setAttribute('fill', r.ink));
    $('lblEmoji').textContent = r.emoji;
    $('nowTitle').textContent = `${r.title} · ${r.genre}`;
    rec.setAttribute('aria-label', (playing ? 'Lift the needle on ' : 'Drop the needle on ') + r.title);
  }

  let playing = false, angle = 0, speed = 0, target = 0, last = performance.now(), spawnAcc = 0, armTimer = null, swapping = false;

  let stopTimer = null;
  function start(){
    if (playing) return;
    playing = true; rec.setAttribute('aria-pressed', true); hint.style.opacity = '0';
    clearTimeout(armTimer); clearTimeout(stopTimer);
    if (!audio) loadAudio(current);
    const a = audio;
    arm.classList.add('down'); light.classList.add('on');
    armTimer = setTimeout(() => {
      if (!playing || a !== audio) return;
      hardStopAll();
      crackleOn(true); target = 200; burst(6);
      a.playbackRate = .55; a.volume = .2;
      const p = a.play();
      if (p && p.catch) p.catch(() => { $('nowTitle').textContent = 'Tap the record again to play'; });
      now.classList.add('playing');
      rampRate(a, .55, 1, 700, .2, 1);
    }, reduce ? 0 : 750);
    paintLabel(current);
  }
  function stop(){
    if (!playing) return;
    playing = false; rec.setAttribute('aria-pressed', false);
    clearTimeout(armTimer); clearTimeout(stopTimer);
    target = 0; light.classList.remove('on'); now.classList.remove('playing');
    crackleOn(false);
    const a = audio;
    if (a && !a.paused) rampRate(a, a.playbackRate, .3, 1200, a.volume, 0, hardStopAll);
    stopTimer = setTimeout(hardStopAll, 1300);           // backup: always silence, even if animation frames pause
    armTimer = setTimeout(() => arm.classList.remove('down'), 250);
    paintLabel(current);
  }
  function toggle(){ if (swapping) return; playing ? stop() : start(); }

  function choose(i){
    if (swapping) return;
    if (i === current) { if (!playing) start(); return; }
    swapping = true; hint.style.opacity = '0';
    [...crate.children].forEach((b, j) => b.setAttribute('aria-pressed', j === i));
    const wasPlaying = playing;
    if (wasPlaying) stop();
    setTimeout(() => {
      discWrap.classList.add('out');
      setTimeout(() => {
        clearTimeout(stopTimer); current = i; loadAudio(i); paintLabel(i); angle = 0;
        discWrap.classList.remove('out');
        setTimeout(() => { swapping = false; if (wasPlaying) start(); }, reduce ? 0 : 480);
      }, reduce ? 0 : 450);
    }, wasPlaying && !reduce ? 700 : 0);
  }

  rec.addEventListener('click', toggle);

  /* ===== floating notes ===== */
  function note(){
    const d = deck.getBoundingClientRect(), h = hero.getBoundingClientRect(), s = d.width / 270;
    const cx = d.left - h.left + 125 * s, cy = d.top - h.top + 125 * s;
    const a = (-150 + Math.random() * 120) * Math.PI / 180, r = 95 * s;
    const el = document.createElement('div');
    el.className = 'note';
    el.textContent = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
    const pal = [RECORDS[current].color, RECORDS[current].rim, '#f6ecd9', '#e9a93b', '#55c8e8'];
    el.style.color = pal[Math.floor(Math.random() * pal.length)];
    el.style.fontSize = (18 + Math.random() * 16) * Math.max(.7, s) + 'px';
    el.style.left = (cx + Math.cos(a) * r) + 'px'; el.style.top = (cy + Math.sin(a) * r) + 'px';
    hero.appendChild(el);
    const dx = Math.cos(a) * (40 + Math.random() * 60) + (Math.random() * 40 - 20), dy = -(45 + Math.random() * 70);
    const rot = Math.random() * 50 - 25, dur = 1800 + Math.random() * 1400;
    el.animate([
      { transform: 'translate(-50%,-50%) scale(.3) rotate(0deg)', opacity: 0 },
      { transform: `translate(calc(-50% + ${dx * .3}px), calc(-50% + ${dy * .3}px)) scale(1) rotate(${rot * .5}deg)`, opacity: 1, offset: .25 },
      { transform: `translate(calc(-50% + ${dx * .7 + 12}px), calc(-50% + ${dy * .7}px)) scale(1.05) rotate(${-rot}deg)`, opacity: .9, offset: .65 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.8) rotate(${rot}deg)`, opacity: 0 }
    ], { duration: dur, easing: 'ease-out' }).onfinish = () => el.remove();
  }
  function burst(n){ if (!reduce) for (let i = 0; i < n; i++) setTimeout(note, i * 90); }

  function frame(t){
    const dt = Math.min(50, t - last) / 1000; last = t;
    speed += (target - speed) * Math.min(1, dt * (target > speed ? 2.2 : 1.4));
    if (Math.abs(speed) < .5 && target === 0) speed = 0;
    angle = (angle + speed * dt) % 360;
    if (!reduce) disc.style.transform = `rotate(${angle}deg)`;
    spawnAcc += dt * (playing ? 3.2 * (speed / 200) : .35);
    while (spawnAcc >= 1) { spawnAcc -= 1; if (!reduce && !swapping) note(); }
    requestAnimationFrame(frame);
  }

  paintLabel(current);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
