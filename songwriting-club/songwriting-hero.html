<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Songwriters' Club</title>
<style>
  :root{--cream:#f6ecd9;--ink:#2a1a12;--orange:#e0612b;--mustard:#e9a93b;--teal:#2a8c82;--plum:#7a5cc0;--rose:#b5487a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ink);color:var(--cream);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
  .hero{height:100%;min-height:300px;display:flex;align-items:center;justify-content:center;gap:34px;padding:18px 24px;position:relative}

  /* ---------- Turntable ---------- */
  .deck{position:relative;width:270px;height:250px;flex:none}
  .plinth{position:absolute;inset:0;border-radius:18px;background:linear-gradient(145deg,#8a5a34,#5e3a20);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 10px 24px rgba(0,0,0,.45);border:3px solid #3c2412}
  .plinth::after{content:"";position:absolute;right:18px;bottom:16px;width:14px;height:14px;border-radius:50%;
    background:#3a2a20;box-shadow:inset 0 0 0 3px #1c120c}
  .light{position:absolute;right:22px;bottom:40px;width:6px;height:6px;border-radius:50%;background:#5a2b16;transition:background .3s, box-shadow .3s}
  .light.on{background:#ff8a4c;box-shadow:0 0 8px #ff8a4c}
  .platter{position:absolute;left:14px;top:14px;width:222px;height:222px;border-radius:50%;background:#2b2b2b;
    box-shadow:0 4px 10px rgba(0,0,0,.6)}
  button.record{all:unset;position:absolute;left:20px;top:20px;width:210px;height:210px;border-radius:50%;cursor:pointer}
  button.record:focus-visible{outline:3px solid #55c8e8;outline-offset:4px}
  .record svg{width:100%;height:100%;display:block}
  .sheen{position:absolute;left:20px;top:20px;width:210px;height:210px;border-radius:50%;pointer-events:none;
    background:conic-gradient(from 20deg,transparent 0 30deg,rgba(255,255,255,.10) 45deg,transparent 60deg 200deg,rgba(255,255,255,.07) 215deg,transparent 230deg)}

  /* tonearm: pivot at top-right of plinth */
  .arm{position:absolute;right:6px;top:12px;width:60px;height:190px;transform-origin:42px 22px;
    transform:rotate(-24deg);transition:transform .9s cubic-bezier(.45,.05,.3,1.2);pointer-events:none;z-index:3}
  .arm.down{transform:rotate(9deg)}

  /* ---------- Notes ---------- */
  .note{position:absolute;pointer-events:none;font-family:"Segoe UI Symbol","Apple Symbols","DejaVu Sans",serif;font-weight:bold;
    text-shadow:0 2px 0 rgba(0,0,0,.35);will-change:transform,opacity;z-index:4}

  /* ---------- Title ---------- */
  .title{max-width:540px}
  .kicker{font-family:"Courier New",monospace;font-size:13px;letter-spacing:4px;color:var(--mustard);font-weight:bold}
  h1{font-family:"Arial Black","Arial Bold",Arial,sans-serif;font-size:44px;line-height:1.05;margin:8px 0 4px;letter-spacing:.5px}
  h1 span{color:var(--orange)}
  .tag{font-family:Georgia,serif;font-style:italic;font-size:20px;color:var(--mustard);margin-bottom:12px}
  .blurb{font-size:15px;line-height:1.5;color:#e8dcc4;margin:0}
  .hint{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-family:"Courier New",monospace;font-size:13px;font-weight:bold;
    color:var(--ink);background:var(--mustard);padding:6px 12px;border-radius:20px;transition:opacity .4s}
  .hint .dot{width:8px;height:8px;border-radius:50%;background:var(--orange);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{transform:scale(1.6);opacity:.5}}

  @media (max-width:640px){
    .hero{flex-direction:column;gap:6px;padding:8px 12px}
    .deck{transform:scale(.56);margin:-52px 0 -54px}
    .kicker{font-size:10px;letter-spacing:2px}
    h1{font-size:26px;margin:4px 0 2px}.tag{font-size:15px;margin-bottom:6px}.blurb{display:none}.title{text-align:center}
    .hint{margin-top:4px;font-size:11px}
  }
  @media (prefers-reduced-motion:reduce){.arm{transition:none}.hint .dot{animation:none}}
</style>
</head>
<body>
<div class="hero" id="hero">
  <div class="deck" id="deck">
    <div class="plinth"></div>
    <div class="light" id="light"></div>
    <div class="platter"></div>
    <button class="record" id="record" aria-pressed="false" aria-label="Drop the needle and spin the record">
      <svg viewBox="0 0 200 200" id="disc" aria-hidden="true">
        <defs>
          <radialGradient id="vg" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#202020"/><stop offset="1" stop-color="#111"/>
          </radialGradient>
          <path id="arcTop" d="M 100 100 m -25 0 a 25 25 0 1 1 50 0"/>
        </defs>
        <circle cx="100" cy="100" r="99" fill="url(#vg)"/>
        <g fill="none" stroke="#2c2c2c" stroke-width="0.8">
          <circle cx="100" cy="100" r="92"/><circle cx="100" cy="100" r="86"/><circle cx="100" cy="100" r="80"/>
          <circle cx="100" cy="100" r="74"/><circle cx="100" cy="100" r="68"/><circle cx="100" cy="100" r="62"/>
          <circle cx="100" cy="100" r="56"/><circle cx="100" cy="100" r="50"/><circle cx="100" cy="100" r="44"/>
        </g>
        <circle cx="100" cy="100" r="35" fill="#e0612b" stroke="#e9a93b" stroke-width="3"/>
        <text font-family="Courier New, monospace" font-size="7.5" font-weight="bold" fill="#2a1a12" letter-spacing="1.5">
          <textPath href="#arcTop" startOffset="50%" text-anchor="middle">SONGWRITERS</textPath>
        </text>
        <text x="100" y="118" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="10" fill="#f6ecd9">OAO</text>
        <text x="100" y="127" text-anchor="middle" font-family="Courier New, monospace" font-size="5.5" font-weight="bold" fill="#2a1a12">SIDE A</text>
        <circle cx="100" cy="100" r="4" fill="#f6ecd9"/>
      </svg>
    </button>
    <div class="sheen"></div>
    <svg class="arm" id="arm" viewBox="0 0 60 190" aria-hidden="true">
      <circle cx="42" cy="22" r="17" fill="#c9c2b4" stroke="#8d8577" stroke-width="2"/>
      <circle cx="42" cy="22" r="8" fill="#6f685d"/>
      <rect x="36" y="2" width="12" height="9" rx="2" fill="#4a443c"/>
      <path d="M42 30 L42 140 Q42 158 30 166" fill="none" stroke="#d8d1c2" stroke-width="5" stroke-linecap="round"/>
      <path d="M42 30 L42 140 Q42 158 30 166" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5" stroke-linecap="round"/>
      <rect x="18" y="160" width="20" height="24" rx="3" fill="#2a1a12" stroke="#e9a93b" stroke-width="2" transform="rotate(28 28 172)"/>
    </svg>
  </div>

  <div class="title">
    <div class="kicker">SIDE A · TRACK 01 · OAO RECORDS</div>
    <h1>THE <span>SONG</span>WRITERS'<br>CLUB</h1>
    <div class="tag">Write it. Hum it. Own it.</div>
    <p class="blurb">A place to turn ideas, feelings, and stories into songs. No experience needed — just bring a notebook and something to say.</p>
    <div class="hint" id="hint"><span class="dot"></span>Click the record to drop the needle! 🔊</div>
  </div>
</div>

<script>
(() => {
  const rec = document.getElementById('record'), disc = document.getElementById('disc'),
        arm = document.getElementById('arm'), light = document.getElementById('light'),
        hint = document.getElementById('hint'), deck = document.getElementById('deck'), hero = document.getElementById('hero');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const GLYPHS = ['♪','♫','♬','♩'], COLORS = ['#e9a93b','#e0612b','#f6ecd9','#55c8e8','#e58fb4','#9be0d4'];


  /* ================= THE SONG (original tune, synthesized live) ================= */
  const Song = (() => {
    const BPM = 138, BEAT = 60 / BPM, BAR = 4;
    const N = n => { const m = {C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11}; const [, l, o] = n.match(/([A-G]#?)(\d)/); return 12 * (+o + 1) + m[l]; };
    // chords: [beatInBar, root, type]  (one or two per bar)
    const CH = [
      [[0,'C3','M']],[[0,'A2','m']],[[0,'F2','M']],[[0,'G2','7']],
      [[0,'C3','M']],[[0,'A2','7']],[[0,'D3','7'],[2,'G2','7']],[[0,'C3','M'],[2,'G2','7']],
      [[0,'F2','M']],[[0,'C3','M']],[[0,'D3','7']],[[0,'G2','7']],
      [[0,'C3','M'],[2,'A2','7']],[[0,'D3','m'],[2,'G2','7']],[[0,'C3','M']],[[0,'G2','7']]
    ];
    // melody: [beat, note, beats]
    const ME = [
      [[0,'E5',1],[1,'G5',1],[2,'E5',.5],[2.5,'C5',.5],[3,'D5',1]],
      [[0,'E5',1.5],[1.5,'C5',.5],[2,'A4',2]],
      [[0,'F5',1],[1,'A5',1],[2,'G5',.5],[2.5,'F5',.5],[3,'E5',1]],
      [[0,'D5',1],[1,'B4',1],[2,'G4',2]],
      [[0,'E5',.5],[.5,'F5',.5],[1,'G5',1],[2,'C6',1],[3,'A5',1]],
      [[0,'G5',1],[1,'E5',1],[2,'C#5',1],[3,'E5',1]],
      [[0,'F#5',1],[1,'A5',1],[2,'G5',1],[3,'F5',1]],
      [[0,'E5',1],[1,'C5',1],[3,'G4',1]],
      [[0,'A5',1],[1,'A5',.5],[1.5,'G5',.5],[2,'F5',1],[3,'A5',1]],
      [[0,'G5',1.5],[1.5,'E5',.5],[2,'C5',2]],
      [[0,'F#5',1],[1,'A5',1],[2,'D6',1],[3,'C6',1]],
      [[0,'B5',1],[1,'G5',1],[2,'F5',1],[3,'D5',1]],
      [[0,'E5',1],[1,'G5',1],[2,'E5',1],[3,'G5',1]],
      [[0,'F5',1],[1,'A5',1],[2,'G5',1],[3,'B4',1]],
      [[0,'C5',.5],[.5,'E5',.5],[1,'G5',.5],[1.5,'C6',1.5],[3,'G5',1]],
      [[0,'F5',1],[1,'D5',1],[2,'B4',1],[3,'G4',1]]
    ];
    const TYPES = { M:[0,4,7], m:[0,3,7], '7':[0,4,7,10] };
    const swing = b => { const f = b % 1; return Math.floor(b) + (Math.abs(f - .5) < 1e-6 ? 2/3 : f); };
    const hz = m => 440 * Math.pow(2, (m - 69) / 12);

    let ctx, out, pitch, wobble, noiseBuf, crackleSrc, timer, startT, nextBar, on = false;

    function chain(){
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      // vintage signal path: highpass -> lowpass -> soft saturation -> master
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 85;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3600; lp.Q.value = .8;
      const sat = ctx.createWaveShaper(); const c = new Float32Array(1024);
      for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; c[i] = Math.tanh(1.8 * x) / Math.tanh(1.8); } sat.curve = c;
      out = ctx.createGain(); out.gain.value = 0;
      hp.connect(lp); lp.connect(sat); sat.connect(out); out.connect(ctx.destination);
      out._in = hp;
      // shared pitch bus (spin-up / wind-down) + record wobble
      pitch = ctx.createConstantSource(); pitch.offset.value = -700; pitch.start();
      const lfo = ctx.createOscillator(); lfo.frequency.value = .55; wobble = ctx.createGain(); wobble.gain.value = 7;
      lfo.connect(wobble); lfo.start();
      out._lfo = lfo;
      if (!noiseBuf) { noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    }
    const tune = p => { pitch.connect(p); wobble.connect(p); };

    function crackle(){
      const len = ctx.sampleRate * 3, b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * .012 + (Math.random() < .0007 ? (Math.random() * 2 - 1) * .6 : 0);
      crackleSrc = ctx.createBufferSource(); crackleSrc.buffer = b; crackleSrc.loop = true;
      const g = ctx.createGain(); g.gain.value = .5; crackleSrc.connect(g); g.connect(out); // crackle skips the filters for crispness
      crackleSrc.start();
    }

    function tone(freq, t, dur, kind, vol){
      const g = ctx.createGain(), oscs = [];
      if (kind === 'lead') {        // bright toy-piano / bell
        const a = ctx.createOscillator(); a.type = 'triangle'; a.frequency.value = freq;
        const b = ctx.createOscillator(); b.type = 'sine'; b.frequency.value = freq * 4; const bg = ctx.createGain(); bg.gain.value = .25;
        a.connect(g); b.connect(bg); bg.connect(g); oscs.push(a, b);
        g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .008);
        g.gain.exponentialRampToValueAtTime(vol * .35, t + .18); g.gain.exponentialRampToValueAtTime(.0001, t + Math.max(.25, dur));
      } else if (kind === 'bass') { // plucky upright bass
        const a = ctx.createOscillator(); a.type = 'triangle'; a.frequency.value = freq; a.connect(g); oscs.push(a);
        g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      } else {                      // honky piano stab
        [-9, 9].forEach(dt => { const a = ctx.createOscillator(); a.type = 'square'; a.frequency.value = freq; a.detune.value = dt; a.connect(g); oscs.push(a); });
        g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      }
      g.connect(out._in);
      oscs.forEach(o => { tune(o.detune); o.start(t); o.stop(t + dur + .3); });
    }
    function brush(t, vol, len, freq){
      const s = ctx.createBufferSource(); s.buffer = noiseBuf; tune(s.detune);
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = .9;
      const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + len);
      s.connect(f); f.connect(g); g.connect(out._in); s.start(t, Math.random()); s.stop(t + len + .05);
    }
    function kick(t){
      const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(48, t + .12);
      g.gain.setValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.0001, t + .18); o.connect(g); g.connect(out._in); o.start(t); o.stop(t + .2);
    }

    function scheduleBar(i, t0){
      const bar = i % 16, at = b => t0 + swing(b) * BEAT;
      // drums: kick 1 & 3, brush snare 2 & 4, swung hats
      [0, 2].forEach(b => kick(at(b)));
      [1, 3].forEach(b => brush(at(b), .35, .16, 2200));
      for (let b = 0; b < 4; b += .5) brush(at(b), b % 1 ? .08 : .12, .05, 7000);
      // chords: bass on 1 & 3 (root / fifth), stabs on 2 & 4
      const chs = CH[bar];
      for (let b = 0; b < 4; b++) {
        const c = [...chs].reverse().find(x => x[0] <= b);
        const root = N(c[1]), iv = TYPES[c[2]];
        if (b % 2 === 0) tone(hz(root + (b === 2 && chs.length === 1 ? 7 : 0)), at(b), BEAT * .9, 'bass', .5);
        else iv.forEach(x => tone(hz(root + 12 + x), at(b), BEAT * .45, 'stab', .035));
        if (b % 2 === 1) tone(hz(root + 12 + iv[1]), at(b + .5), BEAT * .3, 'stab', .02); // little off-beat pickup
      }
      // melody (second time through, an octave sparkle on top)
      ME[bar].forEach(([b, n, d]) => {
        tone(hz(N(n)), at(b), d * BEAT, 'lead', .16);
        if (i >= 16 && i < 32) tone(hz(N(n) + 12), at(b) + .01, d * BEAT * .6, 'lead', .04);
      });
    }

    function loop(){
      const ahead = ctx.currentTime + .4;
      while (startT + nextBar * BAR * BEAT < ahead) { scheduleBar(nextBar, startT + nextBar * BAR * BEAT); nextBar++; }
    }

    return {
      needle(){            // needle touches: crackle starts
        chain(); crackle();
        const t = ctx.currentTime; out.gain.setValueAtTime(0, t); out.gain.linearRampToValueAtTime(.55, t + .15);
      },
      start(){             // record up to speed: band kicks in
        if (on || !ctx) return; on = true;
        const t = ctx.currentTime; pitch.offset.setValueAtTime(-700, t); pitch.offset.linearRampToValueAtTime(0, t + .5);
        startT = t + .05; nextBar = 0; loop(); timer = setInterval(loop, 100);
      },
      stop(){              // classic record wind-down
        if (!ctx || !out) return; on = false; clearInterval(timer);
        const t = ctx.currentTime, o = out, p = pitch, l = out._lfo, cs = crackleSrc;
        p.offset.cancelScheduledValues(t); p.offset.setValueAtTime(p.offset.value, t); p.offset.linearRampToValueAtTime(-1800, t + 1.3);
        o.gain.cancelScheduledValues(t); o.gain.setValueAtTime(o.gain.value, t); o.gain.linearRampToValueAtTime(0, t + 1.3);
        setTimeout(() => { try { cs && cs.stop(); p.stop(); l.stop(); o.disconnect(); } catch (e) {} }, 1500);
        out = null;
      }
    };
  })();

  let playing = false, angle = 0, speed = 0, target = 0, last = performance.now(), spawnAcc = 0, armTimer = null;

  function toggle(){
    playing = !playing;
    rec.setAttribute('aria-pressed', playing);
    rec.setAttribute('aria-label', playing ? 'Lift the needle and stop the record' : 'Drop the needle and spin the record');
    hint.style.opacity = '0';
    clearTimeout(armTimer);
    if (playing) {
      arm.classList.add('down'); light.classList.add('on');
      armTimer = setTimeout(() => { Song.needle(); target = 200; burst(6); setTimeout(() => playing && Song.start(), 450); }, reduce ? 0 : 750);   // needle lands, then the band kicks in
    } else {
      target = 0; light.classList.remove('on'); Song.stop();
      armTimer = setTimeout(() => arm.classList.remove('down'), 250);
    }
  }
  rec.addEventListener('click', toggle);

  // spawn a note from the record, drifting up and away
  function note(){
    const d = deck.getBoundingClientRect(), h = hero.getBoundingClientRect();
    const scale = d.width / 270;
    const cx = d.left - h.left + (20 + 105) * scale, cy = d.top - h.top + (20 + 105) * scale;
    const a = (-150 + Math.random() * 120) * Math.PI / 180;        // upper arc
    const r = 95 * scale;
    const el = document.createElement('div');
    el.className = 'note';
    el.textContent = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
    el.style.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    el.style.fontSize = (18 + Math.random() * 16) + 'px';
    el.style.left = (cx + Math.cos(a) * r) + 'px';
    el.style.top = (cy + Math.sin(a) * r) + 'px';
    hero.appendChild(el);
    const dx = Math.cos(a) * (40 + Math.random() * 60) + (Math.random() * 40 - 20);
    const dy = -(45 + Math.random() * 70);
    const rot = Math.random() * 50 - 25, dur = 1800 + Math.random() * 1400;
    const anim = el.animate([
      { transform: 'translate(-50%,-50%) scale(.3) rotate(0deg)', opacity: 0 },
      { transform: `translate(calc(-50% + ${dx * .3}px), calc(-50% + ${dy * .3}px)) scale(1) rotate(${rot * .5}deg)`, opacity: 1, offset: .25 },
      { transform: `translate(calc(-50% + ${dx * .7 + 12}px), calc(-50% + ${dy * .7}px)) scale(1.05) rotate(${-rot}deg)`, opacity: .9, offset: .65 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.8) rotate(${rot}deg)`, opacity: 0 }
    ], { duration: dur, easing: 'ease-out' });
    anim.onfinish = () => el.remove();
  }
  function burst(n){ if (reduce) return; for (let i = 0; i < n; i++) setTimeout(note, i * 90); }

  function frame(now){
    const dt = Math.min(50, now - last) / 1000; last = now;
    speed += (target - speed) * Math.min(1, dt * (target > speed ? 2.2 : 1.4));   // ease up / wind down
    if (Math.abs(speed) < 0.5 && target === 0) speed = 0;
    angle = (angle + speed * dt) % 360;
    if (!reduce) disc.style.transform = `rotate(${angle}deg)`;
    // notes: lots while playing, an occasional one while idle
    spawnAcc += dt * (playing ? 3.2 * (speed / 200) : 0.35);
    while (spawnAcc >= 1) { spawnAcc -= 1; if (!reduce) note(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
